name: Build Grok Windows

on:
  push:
    branches:
      - grok-preset-v1.0.8
  workflow_dispatch:

permissions:
  contents: read

env:
  RUST_VERSION: "1.95"
  TARGET: x86_64-pc-windows-msvc

jobs:
  test-and-build:
    name: Test and build Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ env.TARGET }}
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: grok-${{ env.TARGET }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        run: cargo test --locked

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release
        run: cargo build --release --locked --target ${{ env.TARGET }}

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "target/${{ env.TARGET }}/release/bili-hardcore.exe" "dist/b站硬核会员答题工具-grok.exe"
          Get-FileHash "dist/b站硬核会员答题工具-grok.exe" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower()) *b站硬核会员答题工具-grok.exe" } |
            Set-Content -Encoding ascii "dist/SHA256SUMS.txt"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: bili-hardcore-v1.0.8-grok-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
