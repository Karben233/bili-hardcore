[package]
name = "bili-hardcore"
version = "1.0.8"
edition = "2024"
description = "B站硬核会员自动答题工具"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:lucide-icons"]

[dependencies]
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures = "0.3"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "deflate", "brotli", "stream"] }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
qrcode = "0.14"
md-5 = "0.10"
hmac = "0.12"
sha2 = "0.10"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "local-time"] }
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
dirs = "6"
urlencoding = "2"
unicode-width = "0.2"
ratatui-image = { version = "9", default-features = false, features = ["crossterm"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
webbrowser = "1"
eframe = { version = "0.36", optional = true, default-features = false, features = ["default_fonts", "glow", "x11"] }
lucide-icons = { version = "1.31", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
